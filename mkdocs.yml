site_name: PyCountant

nav:
- Get Started: index.md
- Excel formulas:
  - excel/index.md
  - Usage: excel/usage.md
  - Validation: excel/validation.md
# reference pages are generated by scripts/gen_ref_pages.py
- Reference: reference/
- Sponsor: sponsor.md

theme:
  icon:
    logo: material/library
  name: "material"
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
      primary: green
      accent: green

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
      primary: green
      accent: green

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
      primary: green
      accent: green

plugins:
- search
# zensical natively supports mkdocstrings (gen-files, literate-nav and
# section-index are not supported, see scripts/gen_ref_pages.py)
- mkdocstrings:
    handlers:
      python:
        paths: ["src"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
