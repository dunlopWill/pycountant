[project]
site_name = "PyCountant"
site_description = "Python package for accountants."
site_url = "https://pycountant.com/"
repo_url = "https://github.com/dunlopWill/pycountant"
repo_name = "dunlopWill/pycountant"

# Reference pages are generated by scripts/gen_ref_pages.py.
nav = [
  { "Get Started" = "index.md" },
  { "Currency" = [
    "currency/index.md",
    { "Exchange rates" = "currency/fx.md" },
  ] },
  { "Tax" = "tax.md" },
  { "Excel formulas" = [
    "excel/index.md",
    { "Usage" = "excel/usage.md" },
    { "Validation" = "excel/validation.md" },
  ] },
  { "Reference" = "reference/index.md" },
  { "Sponsor" = "sponsor.md" },
]

[project.theme]
icon.logo = "material/library"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "green"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.markdown_extensions.admonition]
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
