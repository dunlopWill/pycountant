[project]
name = "pycountant"
version = "0.3.0"
description = "Python package for accountants."
readme = "README.md"
authors = [
    { name = "Will Dunlop", email = "willmdunlop@gmail.com" }
]
maintainers = [
    { name = "Will Dunlop", email = "willmdunlop@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["accounting", "currency", "fx", "tax", "excel", "openpyxl", "formula"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Typing :: Typed",
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pycountry>=24.6.1",
    "pydantic>=2.12",
    "pydantic-extra-types>=2.10.5",
]

[project.urls]
homepage = "https://github.com/dunlopWill/pycountant"
documentation = "https://pycountant.com"
bugs = "https://github.com/dunlopWill/pycountant/issues"
changelog = "https://github.com/dunlopWill/pycountant/releases"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "openpyxl>=3.1",
    "pytest>=8",
]
typecheck = [
    "pyright",
    "ty",
    "types-openpyxl",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: evaluates a workbook in headless LibreOffice; deselect with -m 'not slow'",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.format]
# Ruff also formats Python inside Markdown fences.  The excel docs rely on aligned
# trailing comments to show input next to the formula Excel receives, and
# collapsing them to a single space loses that column.  Prose is hand-formatted.
exclude = ["*.md"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip has to run before the imports it guards.
"tests/excel_test/openpyxl_roundtrip_test.py" = ["E402"]
"tests/excel_test/recalc_test.py" = ["E402"]
# Stub signatures are dense one-liners; wrapping them defeats the point.
"*.pyi" = ["E501"]


[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"

# pyright is the authoritative checker -- the package ships py.typed, so its own
# type errors surface in consumers' editors.  ty runs alongside it in CI.
[tool.ty.environment]
python-version = "3.13"

# The deliberately-wrong calls here are the stubs working: each already carries a
# `# pyright: ignore[reportCallIssue]`, which ty does not read.
[[tool.ty.overrides]]
include = ["tests/excel_test/validation_test.py"]

[tool.ty.overrides.rules]
missing-argument = "ignore"
too-many-positional-arguments = "ignore"

# RangeRef.count deliberately shadows str.count; renaming it would break the API.
[[tool.ty.overrides]]
include = ["src/pycountant/excel/refs.py"]

[tool.ty.overrides.rules]
incompatible-method-override = "ignore"


[tool.coverage.run]
branch = true
parallel = true
source = ["src/pycountant"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 88
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
